<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="./functions.js" defer></script>

    <title>Frontend Mentor | Fylo data storage component</title>
  </head>
  <body>
    <main>
      <div class="brand-container">
        <div class="logo">
          <img src="./images/logo.svg" alt="Fylo Logo" />
        </div>
        <div class="options">
          <div class="option-item">
            <img src="./images/icon-document.svg" alt="Document Icon" />
          </div>
          <div class="option-item">
            <img src="./images/icon-folder.svg" alt="Folder Icon" />
          </div>
          <div class="option-item">
            <img src="./images/icon-upload.svg" alt="Upload Icon" />
          </div>
        </div>
      </div>
      <div class="utilization-container">
        <p class="usage">You’ve used <span>815 GB</span> of your storage</p>
        <div class="range-container">
          <input
            type="range"
            min="0"
            max="1000"
            value="815"
            class="slider"
            id="myRange"
          />
          <div class="range-values">
            <p>0 GB</p>
            <p>1000 GB</p>
          </div>
        </div>
        <div class="remaining">
          <p>185<span>GB LEFT</span></p>
        </div>
      </div>
      <footer class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a
        >. Coded by <a href="#">Adekoya Oladayo</a>.
      </footer>
    </main>
  </body>
</html>
